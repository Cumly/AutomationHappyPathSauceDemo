webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "test-type",
        "no-sandbox",
        "ignore-certificate-errors",
        "--start-maximized",          # Cambiado para que veas la ventana completa
        "incognito",
        "disable-infobars",
        "disable-gpu",
        "disable-default-apps",
        "disable-popup-blocking",
        "remote-allow-origins=*",
        # "--headless",               # <--- COMENTA ESTA LÍNEA PARA VER LA EJECUCIÓN
        "--disable-dev-shm-usage",
        "--disable-features=SafeBrowsingPasswordCheck"
      ]
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
      }
    }
  }
}

serenity {
  take.screenshots = FOR_EACH_ACTION
  console.colors = true
  logging = VERBOSE
}