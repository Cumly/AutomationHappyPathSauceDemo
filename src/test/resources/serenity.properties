serenity.outputDirectory=target/site/serenity

webdriver.driver=chrome
webdriver.autodownload=true

chrome.switches = --start-maximized --disable-popup-blocking --disable-infobars --disable-features=PasswordLeakDetection --disable-notifications --headless,--no-sandbox,--disable-dev-shm-usage

chrome_preferences.credentials_enable_service = false
chrome_preferences.profile.password_manager_enabled = false

serenity.take.screenshots=FOR_EACH_ACTION
cucumber.monochrome=true
